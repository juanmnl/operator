name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Verification gate: the suites the repo already relies on locally (vitest +
  # cargo test), so a release build can't ship what the tests would have caught.
  # npm run build runs first because tsc is part of it AND cargo test compiles
  # tauri-build, which wants the frontend dist present.
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck + bundle
        run: npm run build

      - name: Renderer tests
        run: npm test

      - name: Rust tests
        run: cargo test --locked --lib
        working-directory: src-tauri

  macos:
    needs: test
    runs-on: macos-14 # Apple Silicon → aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # Decode the App Store Connect API key (.p8) for notarization, if present.
      - name: Prepare notarization key
        if: ${{ env.KEY_B64 != '' }}
        run: |
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing (Developer ID) — tauri-action imports the cert into a temp keychain.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization (App Store Connect API key). APPLE_API_KEY_PATH set above.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater bundle signing (createUpdaterArtifacts).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Just build + sign + notarize here; publishing is handled below so the
          # release lands in the PUBLIC repo, not this private one.
          args: --target aarch64-apple-darwin

      # THE TICKET HAS TO END UP INSIDE THE .app, AND INSIDE THE TARBALL.
      #
      # Notarization succeeded on every recent run ("Finished with status Accepted"), yet
      # `xcrun stapler validate /Applications/Operator.app` on a shipped 0.16.0 says "does not
      # have a ticket stapled" and `spctl` calls it "Unnotarized Developer ID". Apple holds the
      # ticket; the bundle never got it. Two distinct reasons, both real:
      #
      #   1. Stapling a .dmg attaches the ticket to the DISK IMAGE. An app dragged out of it is
      #      not itself stapled — it is a copy of what was inside.
      #   2. `createUpdaterArtifacts` builds Operator.app.tar.gz from the .app as it stands when
      #      the bundler reaches that step. Anything stapled afterwards is not in the tarball.
      #
      # So we staple explicitly here, at the end, and then REBUILD the updater payload from the
      # stapled .app and re-sign it. `stapler staple` is idempotent, so this is safe whether or
      # not the bundler already did it.
      #
      # Why it matters beyond a tidy `spctl`: Gatekeeper reads a stapled ticket without going to
      # Apple's servers. A quarantined copy without one is refused — and when the refused binary
      # is the app spawning ITSELF as the artifact-plane MCP server (`--mcp-serve`), the spawn
      # hangs with no output, no error and no exit code. See
      # dev/briefs/2026-08-20-electron-mcp-serve-probe-RESULT.md, where that failure is measured.
      - name: Staple the notarization ticket, rebuild + re-sign the updater payload
        if: ${{ env.APPLE_API_KEY_PATH != '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/aarch64-apple-darwin/release/bundle
          APP=$(ls -d "$BUNDLE"/macos/*.app | head -1)
          DMG=$(ls "$BUNDLE"/dmg/*.dmg | head -1)
          echo "app: $APP"
          echo "dmg: $DMG"

          # 1. Staple. The .app is the one that matters; the .dmg is stapled too so an offline
          #    first-open of the download is clean.
          xcrun stapler staple -v "$APP"
          xcrun stapler staple -v "$DMG"

          # 2. Rebuild the updater payload FROM THE STAPLED APP. `-C` so the archive root is
          #    `Operator.app` and not the full build path, matching what the bundler produces.
          #    COPYFILE_DISABLE stops bsdtar adding AppleDouble `._` entries, which are not in
          #    the bundler's Rust-written tar and would be junk inside the app on extract.
          TARGZ="$BUNDLE/macos/$(basename "$APP").tar.gz"
          rm -f "$TARGZ" "$TARGZ.sig"
          COPYFILE_DISABLE=1 tar -czf "$TARGZ" -C "$(dirname "$APP")" "$(basename "$APP")"
          echo "rebuilt $TARGZ ($(du -h "$TARGZ" | cut -f1))"

          # 3. Re-sign it with the SAME minisign key the bundler uses. The key, its password and
          #    the public key in tauri.conf.json are untouched — regenerating any of them would
          #    strand every installed copy.
          npx tauri signer sign "$TARGZ"
          test -s "$TARGZ.sig" || { echo "::error::updater payload was not re-signed"; exit 1; }

          # 4. ASSERT, so this cannot silently regress into another release.
          echo "--- stapler validate (.app) ---"
          xcrun stapler validate "$APP"
          echo "--- spctl assessment (.app) ---"
          spctl -a -vvv -t exec "$APP"
          echo "--- stapler validate (.dmg) ---"
          xcrun stapler validate "$DMG"

          # The assertion that actually covers the reported bug: unpack the payload the UPDATER
          # will install and check the ticket is in THAT copy. Validating only the .app on disk
          # would have passed happily while shipping an unstapled tarball — which is the bug.
          VERIFY=$(mktemp -d)
          tar -xzf "$TARGZ" -C "$VERIFY"
          xcrun stapler validate "$VERIFY/$(basename "$APP")"
          spctl -a -vvv -t exec "$VERIFY/$(basename "$APP")"
          rm -rf "$VERIFY"
          echo "stapled .app, .dmg and updater payload all validate"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operator-macos-aarch64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn

      # On a version tag, publish the notarized .dmg to the PUBLIC releases repo
      # (source stays private). Needs RELEASE_REPO_TOKEN — a fine-grained PAT with
      # Contents: write on juanmnl/operator-releases.
      - name: Publish public release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          BUNDLE=src-tauri/target/aarch64-apple-darwin/release/bundle
          DMG=$(ls "$BUNDLE"/dmg/*.dmg | head -1)
          TARGZ=$(ls "$BUNDLE"/macos/*.app.tar.gz | head -1)
          SIG=$(cat "$BUNDLE"/macos/*.app.tar.gz.sig)
          VERSION=${GITHUB_REF_NAME#v}
          # latest.json drives the in-app auto-updater (endpoint = this repo's latest release).
          jq -n --arg v "$VERSION" --arg sig "$SIG" \
            --arg url "https://github.com/juanmnl/operator-releases/releases/download/${GITHUB_REF_NAME}/Operator.app.tar.gz" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version:$v, notes:("Operator " + $v), pub_date:$date, platforms:{"darwin-aarch64":{signature:$sig, url:$url}}}' \
            > latest.json
          echo "Publishing $DMG + updater bundle to operator-releases @ ${GITHUB_REF_NAME}"
          gh release create "$GITHUB_REF_NAME" "$DMG" "$TARGZ" latest.json \
            --repo juanmnl/operator-releases \
            --title "Operator ${GITHUB_REF_NAME}" \
            --notes "Signed & notarized macOS build (Apple Silicon). Auto-update enabled." \
            --verify-tag=false
