name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon → aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-spike/src-tauri

      - name: Install frontend deps
        working-directory: tauri-spike
        run: npm ci

      # The shared renderer lives at repo root (src/renderer) but its deps are in
      # tauri-spike/node_modules; point the root's node_modules there so tsc/vite
      # resolve react, xterm, etc. (Removed once the renderer is consolidated.)
      - name: Link node_modules for the shared renderer
        run: ln -sfn tauri-spike/node_modules node_modules

      # Decode the App Store Connect API key (.p8) for notarization, if present.
      - name: Prepare notarization key
        if: ${{ env.KEY_B64 != '' }}
        run: |
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing (Developer ID) — tauri-action imports the cert into a temp keychain.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization (App Store Connect API key). APPLE_API_KEY_PATH set above.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: tauri-spike
          args: --target aarch64-apple-darwin
          # Create a GitHub Release only for version tags; branch pushes just build.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'Operator __VERSION__' || '' }}
          releaseDraft: false

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operator-macos-aarch64
          path: |
            tauri-spike/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            tauri-spike/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn
