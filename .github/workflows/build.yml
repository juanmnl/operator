name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Verification gate: the suites the repo already relies on locally (vitest +
  # cargo test), so a release build can't ship what the tests would have caught.
  # npm run build runs first because tsc is part of it AND cargo test compiles
  # tauri-build, which wants the frontend dist present.
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck + bundle
        run: npm run build

      - name: Renderer tests
        run: npm test

      - name: Rust tests
        run: cargo test --locked --lib
        working-directory: src-tauri

  macos:
    needs: test
    runs-on: macos-14 # Apple Silicon → aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # Decode the App Store Connect API key (.p8) for notarization, if present.
      - name: Prepare notarization key
        if: ${{ env.KEY_B64 != '' }}
        run: |
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing (Developer ID) — tauri-action imports the cert into a temp keychain.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization (App Store Connect API key). APPLE_API_KEY_PATH set above.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater bundle signing (createUpdaterArtifacts).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Just build + sign + notarize here; publishing is handled below so the
          # release lands in the PUBLIC repo, not this private one.
          args: --target aarch64-apple-darwin

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operator-macos-aarch64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

      # On a version tag, publish the notarized .dmg to the PUBLIC releases repo
      # (source stays private). Needs RELEASE_REPO_TOKEN — a fine-grained PAT with
      # Contents: write on juanmnl/operator-releases.
      - name: Publish public release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          BUNDLE=src-tauri/target/aarch64-apple-darwin/release/bundle
          DMG=$(ls "$BUNDLE"/dmg/*.dmg | head -1)
          TARGZ=$(ls "$BUNDLE"/macos/*.app.tar.gz | head -1)
          SIG=$(cat "$BUNDLE"/macos/*.app.tar.gz.sig)
          VERSION=${GITHUB_REF_NAME#v}
          # latest.json drives the in-app auto-updater (endpoint = this repo's latest release).
          jq -n --arg v "$VERSION" --arg sig "$SIG" \
            --arg url "https://github.com/juanmnl/operator-releases/releases/download/${GITHUB_REF_NAME}/Operator.app.tar.gz" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version:$v, notes:("Operator " + $v), pub_date:$date, platforms:{"darwin-aarch64":{signature:$sig, url:$url}}}' \
            > latest.json
          echo "Publishing $DMG + updater bundle to operator-releases @ ${GITHUB_REF_NAME}"
          gh release create "$GITHUB_REF_NAME" "$DMG" "$TARGZ" latest.json \
            --repo juanmnl/operator-releases \
            --title "Operator ${GITHUB_REF_NAME}" \
            --notes "Signed & notarized macOS build (Apple Silicon). Auto-update enabled." \
            --verify-tag=false
