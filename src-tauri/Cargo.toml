[package]
name = "operator"
version = "0.11.1"
description = "Mission control for working agents"
authors = ["Juan Cornejo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "operator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables multi-webview (Window::add_child) so the preview inspector can embed a
# native webview positioned over the preview panel (see preview_inspect_* in lib.rs).
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
serde_yaml = "0.9"
base64 = "0.22"
# Durable chat store (~/.operator/chat.db) — persists the reading-panel answers so
# they survive restarts / transcript rotation and the panel reads them append-only
# instead of re-deriving from the transcript. `bundled` compiles SQLite from source
# (no system libsqlite dep — keeps the signed macOS build self-contained).
rusqlite = { version = "0.32", features = ["bundled"] }
# Our own (non-native) terminal: alacritty's VT engine parses pty bytes into a grid
# in Rust; the frontend paints a clean cell snapshot as DOM. Pure Rust, no GPU.
alacritty_terminal = "0.25"

# Hermetic scratch repos for the worktree/branch diff tests (already in the tree
# transitively — this just makes it available to #[cfg(test)]).
[dev-dependencies]
tempfile = "3"

# macOS dock-icon swapping at runtime (the in-app icon selector). Versions match
# what Tauri already pulls in (see Cargo.lock) so the objc2 tree stays unified.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

